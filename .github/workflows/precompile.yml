name: precompile

on:
  workflow_dispatch:
    inputs:
      consumer_only:
        description: Verify published binaries on Electra's OTP runtime
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: "true"
  ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

jobs:
  build:
    if: inputs.consumer_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-15
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        if: runner.os != 'macOS'
        with:
          otp-version: "26.2"
          elixir-version: "1.15.8"
      - name: Install macOS OTP and Elixir
        if: runner.os == 'macOS'
        run: |
          curl -fsSO https://elixir-lang.org/install.sh
          sh install.sh elixir@1.15.8 otp@26.2
          echo "$HOME/.elixir-install/installs/otp/26.2/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elixir-install/installs/elixir/1.15.8-otp-26/bin" >> "$GITHUB_PATH"
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - name: Install Linux cross compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Precompile patched native libraries
        shell: bash
        run: |
          elixir .github/scripts/checksums_test.exs
          mix deps.get
          mix elixir_make.precompile
      - uses: actions/upload-artifact@v4
        with:
          name: nif-${{ matrix.name }}
          path: |
            cache/adbc*.tar.gz
            cache/adbc*.sha256
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        if: runner.os != 'macOS'
        with:
          otp-version: "26.2"
          elixir-version: "1.15.8"
      - name: Install macOS OTP and Elixir
        if: runner.os == 'macOS'
        run: |
          curl -fsSO https://elixir-lang.org/install.sh
          sh install.sh elixir@1.15.8 otp@26.2
          echo "$HOME/.elixir-install/installs/otp/26.2/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elixir-install/installs/elixir/1.15.8-otp-26/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: nif-*
          path: cache
          merge-multiple: true
      - name: Verify archives and generate the consumer checksum manifest
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*@version "\([^"]*\)"/\1/p' mix.exs)
          elixir .github/scripts/checksums.exs cache "$VERSION"
      - name: Install test dependencies
        shell: bash
        run: |
          mix deps.get
          mix deps.compile
      - name: Require precompiled ADBC and run its regression suite
        shell: bash
        run: |
          mkdir -p no-source-build
          printf '#!/bin/sh\necho "ADBC source build was unexpectedly attempted" >&2\nexit 99\n' > no-source-build/cmake
          printf '@echo off\r\necho ADBC source build was unexpectedly attempted >&2\r\nexit /b 99\r\n' > no-source-build/cmake.cmd
          chmod +x no-source-build/cmake
          export PATH="$PWD/no-source-build:$PATH"
          mix test --exclude postgresql

  consumer:
    if: inputs.consumer_only == true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.8"
          elixir-version: "1.20.5"
      - name: Install test dependencies
        run: |
          mix deps.get
          mix deps.compile
      - name: Download the published binary and verify on Electra's runtime
        run: |
          mkdir -p no-source-build
          printf '#!/bin/sh\necho "ADBC source build was unexpectedly attempted" >&2\nexit 99\n' > no-source-build/cmake
          chmod +x no-source-build/cmake
          export PATH="$PWD/no-source-build:$PATH"
          mix test --exclude postgresql
          mix run .github/scripts/duckdb_2_cancellation.exs

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.15.8"
      - uses: actions/download-artifact@v4
        with:
          pattern: nif-*
          path: cache
          merge-multiple: true
      - name: Generate checked release manifest
        run: |
          VERSION=$(sed -n 's/.*@version "\([^"]*\)"/\1/p' mix.exs)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          elixir .github/scripts/checksums.exs cache "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          fail_on_unmatched_files: true
          body: Patched ADBC native libraries. All five target archives passed the native regression suite before publication. Commit checksum.exs before updating consumers.
          files: |
            cache/adbc*.tar.gz
            cache/adbc*.sha256
            checksum.exs
